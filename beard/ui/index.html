<!DOCTYPE html>
<html lang="en" data-logo="/logo.png">
<head>
  <meta charset="UTF-8" />
  <title>Grok's Beard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --vscode-foreground: #f3e6d0;
      --vscode-descriptionForeground: #9d9488;
      --vscode-sideBar-background: #1a1410;
      --vscode-input-background: #2a1d16;
      --vscode-input-foreground: #f3e6d0;
      --vscode-widget-border: #3d2a1f;
      --vscode-menu-background: #2a1d16;
      --beard-orange: #c24e16;
      --beard-cream: #f3e6d0;
    }
    html, body, #root {
      position: fixed;
      inset: 0;
      width: var(--app-w, 100%);
      height: var(--app-h, 100%);
      margin: 0;
      overflow: hidden;
      background: var(--vscode-sideBar-background, #1a1410);
    }
  </style>
  <script>
    (function () {
      const apply = () => {
        const vv = window.visualViewport
        const w = Math.round(vv ? vv.width : window.innerWidth)
        const h = Math.round(vv ? vv.height : window.innerHeight)
        const s = document.documentElement.style
        s.setProperty("--app-w", w + "px")
        s.setProperty("--app-h", h + "px")
      }
      apply()
      window.addEventListener("resize", apply)
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", apply)
        window.visualViewport.addEventListener("scroll", apply)
      }
    })()
  </script>
</head>
<body data-logo="/logo.png" data-ctrl-enter="false">
  <div id="root"></div>
  <script src="/fast.js"></script>
</body>
</html>
